; Workstation firmware for the M5Stack T-Lite (SKU K126).
; Matches the official T-Lite pin target: board m5stick-c, espressif32 6.12.0.
; The partition file repeats the table read from this unit's backup.
; Upload replaces the factory application. Do that only after backup/SHA256SUMS checks.

[env:tlite]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
monitor_speed = 460800
upload_speed = 1500000
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified
    adafruit/Adafruit MLX90640
    adafruit/Adafruit BusIO
