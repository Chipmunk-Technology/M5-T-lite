name: ePaperBLE
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ePaperBLE:
    type: application
    platform: iOS
    sources:
      - ePaperBLE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorp.ePaperBLE
        DEVELOPMENT_TEAM: 7WB42P34GM
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: ePaperBLE
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "ePaper BLE"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Connects to your e-paper display over Bluetooth."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
